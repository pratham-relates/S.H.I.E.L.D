<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.H.I.E.L.D. - AR Section</title>
    
    <!-- 1. Include the Model Viewer script (Required) -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            font-family: Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            letter-spacing: 2px;
            color: #00ffff;
        }

        p {
            color: #8b9bb4;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Style the 3D viewing box on the screen */
        model-viewer {
            width: 90%;
            max-width: 500px;
            height: 400px;
            background-color: #111827;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 255, 255, 0.15);
        }

        /* Style the Pokémon GO-style AR launch button */
        #ar-button {
            background-color: #00ffff;
            color: #0b0f19;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 255, 255, 0.4);
            position: absolute;
            bottom: 30px;
        }

        #ar-button:hover {
            background-color: #00cccc;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>S.H.I.E.L.D. AR VIEWER</h1>
    <p>Inspect the asset in 3D or place it in your real-world environment.</p>

    <!-- 2. The Model Viewer Element -->
    <model-viewer 
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
        ar 
        ar-modes="scene-viewer quick-look webxr" 
        camera-controls 
        auto-rotate
        touch-action="pan-y"
        alt="S.H.I.E.L.D 3D Asset">
        
        <!-- 3. This button triggers the AR surface scanner on mobile -->
        <button slot="ar-button" id="ar-button">
            🚀 Launch AR (Surface Scan)
        </button>

    </model-viewer>

</body>
</html>
